# ==============================================================================
# Production Docker Profile (MySQL Container Integration)
# ==============================================================================
spring.application.name=smart-vehicle-compliance-system
server.port=8080

# Database Configuration (Defaults to Docker service 'mysql')
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/vehicle_compliance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Production Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Disable H2 Console in Production
spring.h2.console.enabled=false

# Mail Server (Defaults to Docker service 'mailpit' or production SMTP)
spring.mail.host=${MAIL_HOST:mailpit}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:no-reply@smartvehiclecompliance.com}

# JWT Security
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Daily Cron Schedule (8:00 AM)
compliance.cron.reminder-schedule=${COMPLIANCE_CRON:0 0 8 * * ?}

# Async Thread Pool
async.executor.core-pool-size=5
async.executor.max-pool-size=20
async.executor.queue-capacity=100
async.executor.thread-name-prefix=ComplianceAsync-

