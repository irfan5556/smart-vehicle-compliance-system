# ==============================================================================
# Application Configuration
# ==============================================================================
spring.application.name=smart-vehicle-compliance-system
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8080}

# ==============================================================================
# MySQL Database Configuration
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vehicle_compliance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ==============================================================================
# JPA & Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================================================================
# RapidAPI RTO Integration Configuration
# ==============================================================================
rapidapi.rto.base-url=${RAPIDAPI_RTO_BASE_URL:https://rto-vehicle-details-rc-puc-insurance-mparivahan.p.rapidapi.com}
rapidapi.rto.endpoint-path=${RAPIDAPI_RTO_PATH:/api/rc-vehicle/search-data}
rapidapi.rto.api-key=${RAPIDAPI_KEY:9bd1f8a9d8msh212f42fbac40f77p1094e0jsn9ee62dfcf722}
rapidapi.rto.api-host=${RAPIDAPI_HOST:rto-vehicle-details-rc-puc-insurance-mparivahan.p.rapidapi.com}
rapidapi.rto.connect-timeout-seconds=${RAPIDAPI_CONNECT_TIMEOUT:10}
rapidapi.rto.read-timeout-seconds=${RAPIDAPI_READ_TIMEOUT:15}

# ==============================================================================
# JavaMailSender Configuration
# ==============================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@example.com}
spring.mail.password=${MAIL_PASSWORD:your-email-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:no-reply@smartvehiclecompliance.com}

# ==============================================================================
# Automated Reminder Cron Schedule (Daily at 08:00 AM)
# ==============================================================================
compliance.cron.reminder-schedule=${COMPLIANCE_REMINDER_CRON:0 0 8 * * ?}

# ==============================================================================
# Async Thread Pool Configuration
# ==============================================================================
async.executor.core-pool-size=${ASYNC_CORE_POOL_SIZE:5}
async.executor.max-pool-size=${ASYNC_MAX_POOL_SIZE:20}
async.executor.queue-capacity=${ASYNC_QUEUE_CAPACITY:100}
async.executor.thread-name-prefix=ComplianceAsync-

