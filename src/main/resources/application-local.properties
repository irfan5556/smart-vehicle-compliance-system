# ==============================================================================
# Local Zero-Installation Profile (H2 In-Memory DB in MySQL Compatibility Mode)
# ==============================================================================
spring.application.name=smart-vehicle-compliance-system
server.port=8080

# In-Memory H2 DB simulating MySQL
spring.datasource.url=jdbc:h2:mem:vehicle_compliance_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Dialect for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# Web Console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail server fallback (log only, no real SMTP required)
spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=no-reply@smartvehiclecompliance.com

# RapidAPI Settings
rapidapi.rto.base-url=${RAPIDAPI_RTO_BASE_URL:https://rto-vehicle-details-rc-puc-insurance-mparivahan.p.rapidapi.com}
rapidapi.rto.endpoint-path=${RAPIDAPI_RTO_PATH:/api/rc-vehicle/search-data}
rapidapi.rto.api-key=${RAPIDAPI_KEY:9bd1f8a9d8msh212f42fbac40f77p1094e0jsn9ee62dfcf722}
rapidapi.rto.api-host=${RAPIDAPI_HOST:rto-vehicle-details-rc-puc-insurance-mparivahan.p.rapidapi.com}

# Daily Cron Schedule (08:00 AM)
compliance.cron.reminder-schedule=0 0 8 * * ?

# Async Executor
async.executor.core-pool-size=5
async.executor.max-pool-size=20
async.executor.queue-capacity=100
async.executor.thread-name-prefix=ComplianceAsync-

