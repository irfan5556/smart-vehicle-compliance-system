services:
  # ----------------------------------------------------------------------------
  # 1. Spring Boot 3 Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: vehicle-compliance-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /v3/api-docs
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: local
      - key: SERVER_PORT
        value: 8080
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: JWT_EXPIRATION_MS
        value: 86400000

  # ----------------------------------------------------------------------------
  # 2. React 18 + Tailwind CSS Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: vehicle-compliance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: vehicle-compliance-backend
          property: host
